# lazyvim-feature/ansible-role-feature/tasks/main.yml
---
# The variant is detected once, at bootstrap install time, from /etc/os-release
# and published as a group var in /opt/bootstrap/inventory.yml.
- name: Assert that _securedevcontainer_variant is in the _securedevcontainer_compatibility_list
  ansible.builtin.assert:
    that: _securedevcontainer_variant in _securedevcontainer_compatibility_list
    fail_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is NOT in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."

# ---------------------------------------------------------------------------
# PARAMETER BRACKET — this role has NO defaults. Every value below must arrive
# as an extra-var from install.sh, so a missing one fails here, by name, before
# any work happens.
# ---------------------------------------------------------------------------
- name: Assert that the runner contract was satisfied
  ansible.builtin.assert:
    that:
      - _target_username is defined and _target_username | length > 0
      - _target_user_home is defined and _target_user_home | length > 0
      - _target_arch in ['amd64', 'arm64']
    fail_msg: >-
      This role must be invoked through /opt/bootstrap/run-feature.sh, which
      injects _target_username, _target_user_home and _target_arch.

- name: Assert that every required role parameter was supplied
  ansible.builtin.assert:
    that:
      - _tree_sitter_version is defined and _tree_sitter_version | length > 0
      - _tree_sitter_checksum is defined
      - _stylua_version is defined and _stylua_version | length > 0
      - _stylua_checksum is defined
      - _shfmt_version is defined and _shfmt_version | length > 0
      - _shfmt_checksum is defined
      - _tree_sitter_version is match('^\d+\.\d+\.\d+$')
      - _stylua_version is match('^\d+\.\d+\.\d+$')
      - _shfmt_version is match('^\d+\.\d+\.\d+$')
      - _tree_sitter_checksum | length == 0 or _tree_sitter_checksum is match('^[0-9a-fA-F]{64}$')
      - _stylua_checksum | length == 0 or _stylua_checksum is match('^[0-9a-fA-F]{64}$')
      - _shfmt_checksum | length == 0 or _shfmt_checksum is match('^[0-9a-fA-F]{64}$')
      - _lazyvim_extras is defined and _lazyvim_extras | length > 0
      - _lazyvim_extras is match('^[a-z0-9_.]+(,[a-z0-9_.]+)*$')
      - _lazyvim_extras_list | difference(_lazyvim_extras_supported.keys() | list) | length == 0
    fail_msg: >-
      A required role parameter was not supplied. This role has NO defaults by
      design — install.sh must pass each one via -e, sourced from the matching
      option default in devcontainer-feature.json:
        _tree_sitter_version  <- tree_sitter_version   (mandatory, non-empty)
        _tree_sitter_checksum <- tree_sitter_checksum  (may be empty; uses the pinned map)
        _stylua_version       <- stylua_version        (mandatory, non-empty)
        _stylua_checksum      <- stylua_checksum       (may be empty; uses the pinned map)
        _shfmt_version        <- shfmt_version         (mandatory, non-empty)
        _shfmt_checksum       <- shfmt_checksum        (may be empty; uses the pinned map)
        _lazyvim_extras       <- extras                (mandatory; comma-separated, NO spaces,
                                                        each one of: {{ _lazyvim_extras_supported.keys() | list | join(', ') }})

        every version must look like X.Y.Z
        every checksum, when not empty, must be a 64-character SHA256 hex digest
    success_msg: >-
      tree-sitter {{ _tree_sitter_version }}, stylua {{ _stylua_version }},
      shfmt {{ _shfmt_version }} ({{ _target_arch }});
      extras {{ _lazyvim_extras_list | join(', ') }};
      {{ _lazyvim_lock | length }} locked plugins across every supported extra

# ---------------------------------------------------------------------------
# FEATURE TASKS — userland.
# ---------------------------------------------------------------------------
- name: Check that Neovim is installed
  ansible.builtin.command: "{{ _lazyvim_nvim }} --version"
  register: _lazyvim_nvim_probe
  failed_when: false
  changed_when: false

- name: Assert that Neovim is available
  ansible.builtin.assert:
    that: _lazyvim_nvim_probe.rc == 0
    fail_msg: >-
      lazyvim configures Neovim, and found none at {{ _lazyvim_nvim }}. Add
      ghcr.io/infrashift/trusted-devcontainer-templates/features/neovim to the
      devcontainer.json and order it before this feature.
    success_msg: "{{ _lazyvim_nvim_probe.stdout_lines | first }}"

# --- Formatter and parser CLIs -----------------------------------------------
# Installed FIRST: nvim-treesitter needs the tree-sitter CLI on PATH when
# Neovim starts, and LazyVim reaches for Mason to download one when it is not.
- name: Check the installed CLI versions
  ansible.builtin.command: "{{ _lazyvim_bin_dir }}/{{ item.name }} --version"
  loop: "{{ _lazyvim_tools }}"
  loop_control:
    label: "{{ item.name }}"
  register: _lazyvim_tools_probe
  failed_when: false
  changed_when: false

- name: Start with no CLIs pending
  ansible.builtin.set_fact:
    _lazyvim_tools_pending: []

- name: Collect the CLIs that need installing
  ansible.builtin.set_fact:
    _lazyvim_tools_pending: "{{ _lazyvim_tools_pending + [item.item] }}"
  loop: "{{ _lazyvim_tools_probe.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.rc != 0 or (item.stdout | trim) is not search(item.item.pattern)

- name: Assert that a checksum is available for every pending CLI
  ansible.builtin.assert:
    that: item.checksum | trim | length > 0
    fail_msg: >-
      No SHA256 is pinned for {{ item.name }} {{ item.version }} on {{ _target_arch }}.
      Pass the matching *_checksum option to install a version other than the default.
  loop: "{{ _lazyvim_tools_pending }}"
  loop_control:
    label: "{{ item.name }}"

- name: Ensure each CLI's install directory exists
  ansible.builtin.file:
    path: "{{ _target_user_home }}/.local/share/{{ item.name }}/{{ item.version }}"
    state: directory
    mode: '0755'
  loop: "{{ _lazyvim_tools }}"
  loop_control:
    label: "{{ item.name }}"

- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ _lazyvim_bin_dir }}"
    state: directory
    mode: '0755'

# Zipped releases are downloaded to /tmp and extracted; a bare binary is
# downloaded straight to its final place. Either way get_url verifies it.
- name: Download the pending CLI releases
  ansible.builtin.get_url:
    url: "{{ item.url_base }}/{{ item.asset }}"
    dest: >-
      {{ '/tmp/' ~ item.asset if item.format == 'zip'
         else _target_user_home ~ '/.local/share/' ~ item.name ~ '/' ~ item.version ~ '/' ~ item.name }}
    mode: "{{ '0644' if item.format == 'zip' else '0755' }}"
    checksum: "sha256:{{ item.checksum | trim }}"
    timeout: 120
  loop: "{{ _lazyvim_tools_pending }}"
  loop_control:
    label: "{{ item.name }}"

- name: Extract the zipped CLIs
  ansible.builtin.unarchive:
    src: "/tmp/{{ item.asset }}"
    dest: "{{ _target_user_home }}/.local/share/{{ item.name }}/{{ item.version }}"
    remote_src: true
  loop: "{{ _lazyvim_tools_pending | selectattr('format', 'equalto', 'zip') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Remove the downloaded archives
  ansible.builtin.file:
    path: "/tmp/{{ item.asset }}"
    state: absent
  loop: "{{ _lazyvim_tools | selectattr('format', 'equalto', 'zip') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Symlink the CLIs into ~/.local/bin
  ansible.builtin.file:
    src: "{{ _target_user_home }}/.local/share/{{ item.name }}/{{ item.version }}/{{ item.name }}"
    dest: "{{ _lazyvim_bin_dir }}/{{ item.name }}"
    state: link
    force: true
  loop: "{{ _lazyvim_tools }}"
  loop_control:
    label: "{{ item.name }}"

- name: Verify the installed CLI versions
  ansible.builtin.command: "{{ _lazyvim_bin_dir }}/{{ item.name }} --version"
  loop: "{{ _lazyvim_tools }}"
  loop_control:
    label: "{{ item.name }}"
  register: _lazyvim_tools_verify
  changed_when: false

- name: Assert that every CLI is installed at its requested version
  ansible.builtin.assert:
    that: (item.stdout | trim) is search(item.item.pattern)
    fail_msg: "Expected {{ item.item.name }} {{ item.item.version }}; it reported: {{ item.stdout }}"
    success_msg: "{{ item.stdout | trim }}"
  loop: "{{ _lazyvim_tools_verify.results }}"
  loop_control:
    label: "{{ item.item.name }}"

# --- Configuration -------------------------------------------------------------
- name: Ensure the Neovim config directory exists
  ansible.builtin.file:
    path: "{{ _lazyvim_config_dir }}"
    state: directory
    mode: '0755'

# Copies only the files this feature owns. Anything else a developer adds under
# ~/.config/nvim (their own lua/plugins/*.lua, lazyvim.json) is left alone.
- name: Install the LazyVim configuration and lockfile
  ansible.builtin.copy:
    src: nvim/
    dest: "{{ _lazyvim_config_dir }}/"
    mode: '0644'
    directory_mode: '0755'

- name: Render the language extras ({{ _lazyvim_extras_list | join(', ') }})
  ansible.builtin.template:
    src: extras.lua.j2
    dest: "{{ _lazyvim_config_dir }}/lua/config/extras.lua"
    mode: '0644'

# --- Plugins, at their locked commits ------------------------------------------
#
# THE LOCKFILE COVERS EVERY SUPPORTED EXTRA; AN IMAGE INSTALLS ONLY WHAT ITS OWN
# `extras` NAME. lazy.nvim installs the plugins the rendered spec asks for and
# nothing else, so every check below asks lazy.nvim for that spec
# (SPEC_PLUGINS) instead of walking the whole lockfile -- a plugin only lang.java
# needs is absent from a Go image by design, not a failure. The spec can only be
# read once lazy.nvim and LazyVim are on disk; until then every plugin is
# pending and the restore below installs them.
- name: Check whether lazy.nvim and LazyVim are installed
  ansible.builtin.stat:
    path: "{{ _lazyvim_plugin_dir }}/{{ item }}/.git"
  loop:
    - lazy.nvim
    - LazyVim
  register: _lazyvim_core_stat

- name: Ask lazy.nvim which plugins the spec names (before any restore)
  ansible.builtin.command:
    argv:
      - "{{ _lazyvim_nvim }}"
      - --headless
      - "+lua {{ _lazyvim_lua_spec_plugins }}"
      - +qa
  register: _lazyvim_spec_before
  changed_when: false
  failed_when: false
  when: _lazyvim_core_stat.results | selectattr('stat.exists') | list | length == 2

- name: Read the spec, when it could be asked for
  ansible.builtin.set_fact:
    _lazyvim_spec_known: "{{ (_lazyvim_spec_before.stdout | default('')) is search('SPEC_PLUGINS=') }}"
    _lazyvim_spec: >-
      {{ ((_lazyvim_spec_before.stdout | default('')) | regex_findall('SPEC_PLUGINS=(.*)') + ['[]']) | first | from_json }}

- name: Check each plugin's checked-out commit (the spec's, or the whole lockfile before LazyVim exists)
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ _lazyvim_plugin_dir }}/{{ item }}"
      - rev-parse
      - HEAD
  loop: >-
    {{ (_lazyvim_spec | intersect(_lazyvim_lock.keys() | list)) if _lazyvim_spec_known
       else (_lazyvim_lock.keys() | list) }}
  register: _lazyvim_plugin_probe
  failed_when: false
  changed_when: false

- name: Start with no plugins pending
  ansible.builtin.set_fact:
    _lazyvim_plugins_pending: "{{ [] if _lazyvim_spec_known else ['LazyVim'] }}"

- name: Collect the plugins that are missing or not at their locked commit
  ansible.builtin.set_fact:
    _lazyvim_plugins_pending: "{{ _lazyvim_plugins_pending + [item.item] }}"
  loop: "{{ _lazyvim_plugin_probe.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0 or (item.stdout | trim) != _lazyvim_lock[item.item].commit

# lazy.nvim is the plugin manager, so it cannot install itself. Clone it at the
# locked commit; lazy.lua refuses to fetch an unpinned copy if it is missing.
- name: Install lazy.nvim at its locked commit
  ansible.builtin.git:
    repo: "{{ _lazyvim_lazy_nvim_repo }}"
    dest: "{{ _lazyvim_plugin_dir }}/lazy.nvim"
    version: "{{ _lazyvim_lock['lazy.nvim'].commit }}"
    force: true
  when: not (_lazyvim_core_stat.results | selectattr('item', 'equalto', 'lazy.nvim') | first).stat.exists
        or 'lazy.nvim' in _lazyvim_plugins_pending

# `Lazy! restore` installs any missing plugin and moves every plugin to the
# commit in lazy-lock.json. Its exit status says little -- headless Neovim exits
# 0 after most plugin errors -- so success is decided by the re-check below.
#
# ONE PASS IS NOT ENOUGH (1.0.1). The headless Neovim that runs the restore
# first starts up, and at startup lazy installs every missing plugin -- cloning
# each at its default branch -- and then REWRITES lazy-lock.json from the
# commits it finds on disk (and drops every entry its spec does not name). A
# plugin whose install-time checkout did not happen is recorded at its branch
# tip, and the restore that follows reads the rewritten lockfile and has nothing
# to do (nvim-treesitter, 2026-09-26). So: put the shipped lockfile back,
# restore again for whatever is still off its pin, and put it back once more so
# the image carries exactly the file this feature ships.
- name: Restore every plugin to its locked commit
  ansible.builtin.command:
    argv:
      - "{{ _lazyvim_nvim }}"
      - --headless
      - "+Lazy! restore"
      - +qa
  register: _lazyvim_restore
  when: _lazyvim_plugins_pending | length > 0
  changed_when: true

- name: Put the shipped lockfile back after lazy.nvim rewrote it
  ansible.builtin.copy:
    src: nvim/lazy-lock.json
    dest: "{{ _lazyvim_config_dir }}/lazy-lock.json"
    mode: '0644'
  when: _lazyvim_plugins_pending | length > 0

- name: Ask lazy.nvim which plugins the spec names (after the first pass)
  ansible.builtin.command:
    argv:
      - "{{ _lazyvim_nvim }}"
      - --headless
      - "+lua {{ _lazyvim_lua_spec_plugins }}"
      - +qa
  register: _lazyvim_spec_after
  changed_when: false

- name: Assert that the spec probe ran
  ansible.builtin.assert:
    that: _lazyvim_spec_after.stdout is search('SPEC_PLUGINS=')
    fail_msg: "The lazy.nvim spec probe did not report. stdout: {{ _lazyvim_spec_after.stdout }} stderr: {{ _lazyvim_spec_after.stderr }}"
    quiet: true

- name: Read the spec
  ansible.builtin.set_fact:
    _lazyvim_spec: "{{ _lazyvim_spec_after.stdout | regex_findall('SPEC_PLUGINS=(.*)') | last | from_json }}"

# Every plugin the spec names must be one the lockfile pins: a plugin outside it
# would be installed at whatever its branch tip happens to be.
- name: Assert that the lockfile covers every plugin the spec names
  ansible.builtin.assert:
    that: _lazyvim_spec | difference(_lazyvim_lock.keys() | list) | length == 0
    fail_msg: >-
      The spec names plugins lazy-lock.json does not pin:
      {{ _lazyvim_spec | difference(_lazyvim_lock.keys() | list) | join(', ') }}.
      Add the extra to files/extras.json and run `make lazy-lock`.
    success_msg: "all {{ _lazyvim_spec | length }} plugins of the spec are pinned in lazy-lock.json"

- name: Check which plugins the first pass left off their locked commit
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ _lazyvim_plugin_dir }}/{{ item }}"
      - rev-parse
      - HEAD
  loop: "{{ _lazyvim_spec }}"
  register: _lazyvim_plugin_second
  failed_when: false
  changed_when: false
  when: _lazyvim_plugins_pending | length > 0

- name: Start with no plugins left off their locked commit
  ansible.builtin.set_fact:
    _lazyvim_plugins_off: []

- name: Collect the plugins the first pass left off their locked commit
  ansible.builtin.set_fact:
    _lazyvim_plugins_off: "{{ _lazyvim_plugins_off + [item.item] }}"
  loop: "{{ _lazyvim_plugin_second.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item is not skipped
    - item.rc != 0 or (item.stdout | trim) != _lazyvim_lock[item.item].commit

- name: Restore again, from the shipped lockfile, what the first pass missed ({{ _lazyvim_plugins_off | join(', ') }})
  ansible.builtin.command:
    argv:
      - "{{ _lazyvim_nvim }}"
      - --headless
      - "+Lazy! restore"
      - +qa
  register: _lazyvim_restore_second
  when: _lazyvim_plugins_off | length > 0
  changed_when: true

- name: Put the shipped lockfile back after the second pass
  ansible.builtin.copy:
    src: nvim/lazy-lock.json
    dest: "{{ _lazyvim_config_dir }}/lazy-lock.json"
    mode: '0644'
  when: _lazyvim_restore_second is changed

- name: Re-check each plugin's checked-out commit
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ _lazyvim_plugin_dir }}/{{ item }}"
      - rev-parse
      - HEAD
  loop: "{{ _lazyvim_spec }}"
  register: _lazyvim_plugin_verify
  failed_when: false
  changed_when: false

- name: Assert that every plugin of the spec is at its locked commit
  ansible.builtin.assert:
    that: item.rc == 0 and (item.stdout | trim) == _lazyvim_lock[item.item].commit
    fail_msg: >-
      {{ item.item }} is at '{{ item.stdout | default('') | trim }}' (rc={{ item.rc }}),
      but lazy-lock.json pins {{ _lazyvim_lock[item.item].commit }}.
      {{ (((_lazyvim_restore_second.stderr | default('')) or (_lazyvim_restore.stderr | default(''))) | trim)[-800:] }}
    quiet: true
  loop: "{{ _lazyvim_plugin_verify.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Ask lazy.nvim which plugins it considers missing
  ansible.builtin.command:
    argv:
      - "{{ _lazyvim_nvim }}"
      - --headless
      - "+lua {{ _lazyvim_lua_missing_plugins }}"
      - +qa
  register: _lazyvim_lazy_state
  changed_when: false

# A Lua error in a headless `+lua` command is printed and then ignored: Neovim
# still exits 0, just without the marker line. Say so, with what Neovim said,
# instead of failing later on a regex that matched nothing.
- name: Assert that the plugin probe ran
  ansible.builtin.assert:
    that: _lazyvim_lazy_state.stdout is search('MISSING_PLUGINS=')
    fail_msg: "The lazy.nvim probe did not report. stdout: {{ _lazyvim_lazy_state.stdout }} stderr: {{ _lazyvim_lazy_state.stderr }}"
    quiet: true

- name: Assert that lazy.nvim has every plugin in its spec installed
  ansible.builtin.assert:
    that: >-
      (_lazyvim_lazy_state.stdout | regex_findall('MISSING_PLUGINS=(.*)') | last | from_json | list) == []
    fail_msg: >-
      lazy.nvim reports plugins in the spec that are not installed -- the spec
      names a plugin lazy-lock.json does not cover. Run `make lazy-lock`.
      {{ _lazyvim_lazy_state.stdout }}
    success_msg: "all {{ _lazyvim_spec | length }} plugins of the spec installed at their locked commits"

# --- Tree-sitter parsers -------------------------------------------------------
# nvim-treesitter builds each parser from the grammar revision its own (locked)
# commit pins, with the tree-sitter CLI and gcc installed above.
- name: Find the tree-sitter parsers LazyVim wants that are not installed
  ansible.builtin.command:
    argv:
      - "{{ _lazyvim_nvim }}"
      - --headless
      - "+lua {{ _lazyvim_lua_missing_parsers }}"
      - +qa
  register: _lazyvim_parsers_probe
  changed_when: false

- name: Assert that the parser probe ran
  ansible.builtin.assert:
    that: _lazyvim_parsers_probe.stdout is search('MISSING_PARSERS=')
    fail_msg: "The tree-sitter probe did not report. stdout: {{ _lazyvim_parsers_probe.stdout }} stderr: {{ _lazyvim_parsers_probe.stderr }}"
    quiet: true

- name: Collect the missing parsers
  ansible.builtin.set_fact:
    _lazyvim_parsers_pending: >-
      {{ _lazyvim_parsers_probe.stdout | regex_findall('MISSING_PARSERS=(.*)') | last | from_json | list }}

# install() is asynchronous; :wait() blocks until every parser is built, so
# Neovim cannot exit halfway through (which is what `+qa` alone would do).
#
# The list is rendered as a Lua table -- {"go","bash"} -- not with to_json,
# whose ["go","bash"] is a Lua syntax error that headless Neovim prints and
# ignores. The marker line proves the call actually ran to completion.
#
# force: only the parsers the probe found missing are passed, and a parser whose
# .so is gone but whose install record survived would otherwise be skipped as
# already installed.
- name: Build the missing tree-sitter parsers
  ansible.builtin.command:
    argv:
      - "{{ _lazyvim_nvim }}"
      - --headless
      - >-
        +lua require('nvim-treesitter').install({ {{ _lazyvim_parsers_pending | map('to_json') | join(', ') }} }, { force = true }):wait(1800000)
        io.stdout:write("\nPARSERS_INSTALLED\n")
      - +qa
  register: _lazyvim_parsers_install
  when: _lazyvim_parsers_pending | length > 0
  changed_when: true
  failed_when: _lazyvim_parsers_install.stdout is not search('PARSERS_INSTALLED')

- name: Re-check the tree-sitter parsers
  ansible.builtin.command:
    argv:
      - "{{ _lazyvim_nvim }}"
      - --headless
      - "+lua {{ _lazyvim_lua_missing_parsers }}"
      - +qa
  register: _lazyvim_parsers_verify
  changed_when: false

- name: Assert that the parser re-check ran
  ansible.builtin.assert:
    that: _lazyvim_parsers_verify.stdout is search('MISSING_PARSERS=')
    fail_msg: "The tree-sitter re-check did not report. stdout: {{ _lazyvim_parsers_verify.stdout }} stderr: {{ _lazyvim_parsers_verify.stderr }}"
    quiet: true

- name: Assert that every parser LazyVim wants is installed
  ansible.builtin.assert:
    that: >-
      (_lazyvim_parsers_verify.stdout | regex_findall('MISSING_PARSERS=(.*)') | last | from_json | list) == []
    fail_msg: "tree-sitter parsers still missing after install: {{ _lazyvim_parsers_verify.stdout }}"
    success_msg: "every tree-sitter parser LazyVim asks for is installed"
