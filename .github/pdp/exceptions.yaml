# CVE exception register.
#
# An entry here moves a finding from `blocking` to `waived`. It never HIDES it:
# waived findings appear in the PR comment table and in the signed review
# verdict, carrying this entry's id, owner, expiry and justification.
#
# Every field is required. An entry missing `expires` or `justification` -- or
# carrying a justification under 20 characters -- waives NOTHING, and is
# reported as WAIVER_NO_EXPIRY or WAIVER_NO_JUSTIFICATION so the author finds
# out why rather than assuming it worked.
#
# Expiry is evaluated against the workflow's `evaluated_at`, never a wall clock
# inside the policy, so a decision made today replays identically in a year --
# which is what makes a signed verdict worth signing. An expired waiver is
# reported as WAIVER_EXPIRED and suppresses nothing.
#
# `templates` scopes the waiver. Omit it, or leave it empty, to apply to every
# template -- deliberate and visible here rather than implied by omission.
#
# An exception is an accepted risk with an owner and a date. It is not a way to
# make a red check go green. Before adding one, check whether a newer base
# digest or feature release clears the finding instead.

waivers:
  # --------------------------------------------------------------------------
  # Both entries cover findings in DISTRO-PACKAGED binaries. `fix_state: fixed`
  # is true of the Go MODULE -- a patched release exists -- but not of the
  # binary: only the packager can rebuild against it. Nothing in this repository
  # or in trusted-devcontainer-features can clear them, and the base image is
  # already pinned to the newest published digest (latest == 20260818 ==
  # sha256:1ed67eb1...), so there is no bump available either.
  #
  # These are NOT waived because they are inconvenient. Everything else the gate
  # reported traces to feature versions this org controls, and those are being
  # fixed rather than waived -- see TODO 11.
  #
  # SCOPING. Both entries carry `locations`, and that is load-bearing. The same
  # stdlib and golang.org/x/* CVE ids appear inside EVERY Go binary in the image.
  # Without a location scope these entries also suppressed 14 real findings in
  # syft and grype -- artifacts they say nothing about, and whose versions this
  # org does control. An exception must waive what its justification describes
  # and nothing else.
  # --------------------------------------------------------------------------

  - id: EXC-2026-0001
    templates: []          # every template installs git-lfs
    locations:             # ONLY this binary -- see the note on scoping below
      - /usr/bin/git-lfs
    issued: "2026-08-24T00:00:00Z"
    expires: "2026-11-22T00:00:00Z"
    owner: "@ryancraig"
    justification: >-
      36 findings inside /usr/bin/git-lfs, a Fedora RPM built with go1.25.1 and
      carrying vulnerable golang.org/x/crypto and stdlib. The fixes grype cites
      are Go TOOLCHAIN versions (1.25.6, 1.25.7, 1.26.0-rc.3), so clearing them
      means Fedora rebuilding git-lfs with a newer Go. We install it via dnf and
      cannot influence that. Re-evaluate when Fedora ships a rebuilt package, or
      reconsider installing git-lfs from upstream release binaries instead --
      which would trade distro packaging and signing for version control.
    cves:
    - GHSA-5cgq-3rg8-m6cv
    - GHSA-89gr-r52h-f8rx
    - GHSA-f5wc-c3c7-36mc
    - GHSA-jppx-rxg9-jmrx
    - GHSA-q4h4-gmj2-qvw2
    - GHSA-rm3j-f69w-wqmq
    - GHSA-vgwf-h737-ff37
    - GHSA-w879-237q-wc7r
    - GHSA-x527-x647-q7gg
    - GO-2025-4006
    - GO-2025-4007
    - GO-2025-4009
    - GO-2025-4013
    - GO-2025-4116
    - GO-2025-4155
    - GO-2026-4337
    - GO-2026-4341
    - GO-2026-4601
    - GO-2026-4870
    - GO-2026-4918
    - GO-2026-4946
    - GO-2026-4947
    - GO-2026-4970
    - GO-2026-4971
    - GO-2026-4977
    - GO-2026-4981
