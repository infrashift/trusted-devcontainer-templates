# CVE exception register.
#
# An entry here moves a finding from `blocking` to `waived`. It never HIDES it:
# waived findings appear in the PR comment table and in the signed review
# verdict, carrying this entry's id, owner, expiry and justification.
#
# Every field is required. An entry missing `expires` or `justification` -- or
# carrying a justification under 20 characters -- waives NOTHING, and is
# reported as WAIVER_NO_EXPIRY or WAIVER_NO_JUSTIFICATION so the author finds
# out why rather than assuming it worked.
#
# Expiry is evaluated against the workflow's `evaluated_at`, never a wall clock
# inside the policy, so a decision made today replays identically in a year --
# which is what makes a signed verdict worth signing. An expired waiver is
# reported as WAIVER_EXPIRED and suppresses nothing.
#
# `templates` scopes the waiver. Omit it, or leave it empty, to apply to every
# template -- deliberate and visible here rather than implied by omission.
#
# An exception is an accepted risk with an owner and a date. It is not a way to
# make a red check go green. Before adding one, check whether a newer base
# digest or feature release clears the finding instead.

waivers:
  # --------------------------------------------------------------------------
  # ONE entry, covering the Criticals vendored inside /usr/bin/git-lfs.
  #
  # This register was much larger. It listed 41 CVEs across two entries, because
  # the gate blocked on every High-with-a-fix regardless of who could act on it.
  # The remediation distinction in policies.rego now records a vendored High
  # instead of blocking it, so those entries stopped doing anything and were
  # removed -- including the fzf entry entirely. A waiver that suppresses nothing
  # is not harmless: it reads as an accepted risk that someone reviewed, and it
  # comes back for renewal every 90 days carrying no information.
  #
  # What remains is the case that genuinely needs a human decision. A CRITICAL
  # blocks wherever it lives, vendored or not, because deciding to ship one is
  # exactly the judgement a gate should force someone to make and sign.
  # --------------------------------------------------------------------------

  - id: EXC-2026-0001
    templates: []          # every template installs git-lfs
    locations:             # this binary only -- the same CVE ids appear in every
      - /usr/bin/git-lfs   # Go binary, and must keep blocking elsewhere
    issued: "2026-08-24T00:00:00Z"
    expires: "2026-11-22T00:00:00Z"
    owner: "@ryancraig"
    justification: >-
      Critical findings in golang.org/x/crypto and the Go stdlib vendored into
      /usr/bin/git-lfs, a Fedora RPM (built with go1.25.12 as of the 2026-10-28
      base). The fixes grype cites
      are Go TOOLCHAIN versions, so clearing them means Fedora rebuilding the
      package; we install it via dnf and cannot influence that. The base image is
      already pinned to the newest published digest, so there is no bump to take.
      Re-evaluate when Fedora ships a rebuilt git-lfs, or reconsider installing
      it from upstream release binaries -- which trades distro packaging and
      signing for version control.
    cves:
    - GHSA-5cgq-3rg8-m6cv
    - GHSA-89gr-r52h-f8rx
    - GHSA-f5wc-c3c7-36mc
    - GHSA-jppx-rxg9-jmrx
    - GHSA-rm3j-f69w-wqmq
    - GHSA-vgwf-h737-ff37
    - GHSA-x527-x647-q7gg
    - GO-2026-4337
    - GO-2026-6604         # added 2026-10-28: Windows-only os.Root junction escape
    - GO-2026-6612         # added 2026-10-28: HTTP/2 server flow control; git-lfs is a client

  # --------------------------------------------------------------------------
  # GO-2026-6604 / GO-2026-6612 in the newest upstream release of four Go tools:
  #
  #   grype 0.121.0, syft 1.55.0   go1.26.8   both ids
  #   cue 0.17.1 (cuelang)         go1.26.5   GO-2026-6612
  #   shfmt 3.14.1 (lazyvim)       go1.27.1   GO-2026-6604
  #
  # Same shape as EXC-2026-0001: the fix grype cites is a Go TOOLCHAIN version,
  # so only an upstream rebuild clears it, and as of 2026-10-28 each of these is
  # the newest release there is. Scoped to these exact paths so the same ids
  # keep blocking in every other Go binary; the shfmt path carries its version,
  # so bumping shfmt stops this entry matching on its own. Kept short (30 days)
  # on purpose: the next release of each should land on go>=1.26.9 / 1.27.2 and
  # make its location here suppress nothing.
  # --------------------------------------------------------------------------

  - id: EXC-2026-0002
    templates: []          # grype/syft: every template; cue and shfmt: some
    locations:
      - /home/dev/.local/bin/grype
      - /home/dev/.local/bin/syft
      - /home/dev/.local/share/cue/cue
      - /home/dev/.local/share/shfmt/3.14.1/shfmt
    issued: "2026-10-28T00:00:00Z"
    expires: "2026-11-27T00:00:00Z"
    owner: "@ryancraig"
    justification: >-
      Go stdlib vendored into the newest grype (0.121.0), syft (1.55.0), cue
      (0.17.1) and shfmt (3.14.1) releases; the fix is a toolchain rebuild
      upstream that has not shipped yet. Neither finding is reachable here:
      GO-2026-6604 is a Windows-only os.Root junction escape, and these images
      are Linux. GO-2026-6612 is HTTP/2 SERVER connection-level flow control;
      grype, syft and cue only act as HTTP clients (cue's LSP is stdio, and its
      experimental local registry is plain HTTP, where Go does not serve HTTP/2
      unless explicitly enabled). Re-evaluate as each tool ships a build on
      go>=1.26.9 / 1.27.2: re-pin its feature and drop its location here.
    cves:
    - GO-2026-6604
    - GO-2026-6612
