  - id: EXC-2026-0002
    templates: []          # fzf ships in the base image, so it is in all of them
    locations:
      - /usr/bin/fzf
    issued: "2026-08-24T00:00:00Z"
    expires: "2026-11-22T00:00:00Z"
    owner: "@ryancraig"
    justification: >-
      5 findings inside /usr/bin/fzf, which comes from the fedora43-minimal base
      image rather than from any feature. The base is already pinned to the
      newest digest published by trusted-base-images, so there is no newer image
      to move to. Clearing these needs a base rebuild in that repository.
    cves:
    - GO-2026-5026
    - GO-2026-5972
    - GO-2026-6088
    - GO-2026-6089
    - GO-2026-6090
