name: Release Templates

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

env:
  TEMPLATES: "ansible-cue dotnet-node go-cue java python"
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Functional validation of all templates
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test all templates
        run: |
          set -euo pipefail
          for template in $TEMPLATES; do
            echo "::group::Testing ${template}"
            devcontainer up --workspace-folder "src/${template}" \
              --mount "type=bind,source=${GITHUB_WORKSPACE}/test,target=/tmp/tdt-test"
            devcontainer exec --workspace-folder "src/${template}" \
              bash /tmp/tdt-test/${template}/test.sh
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # Job 2: Build, scan, sign evidence, enforce policy
  # ---------------------------------------------------------------------------
  scan:
    needs: test
    runs-on: ubuntu-latest
    env:
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Install grype
        uses: anchore/scan-action/download-grype@v6

      - name: Install OPA
        run: |
          curl -fsSL -o /usr/local/bin/opa \
            https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa

      - name: Scan all templates
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA:0:12}"

          for template in $TEMPLATES; do
            echo "::group::Scanning ${template}"
            dir="evidence/${template}"
            mkdir -p "${dir}"
            image="tdt-scan-${template}:${sha}"

            # Build the full devcontainer image
            devcontainer build \
              --workspace-folder "src/${template}" \
              --image-name "${image}"

            # Generate SBOM
            syft "${image}" -o spdx-json="${dir}/sbom.json"
            cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY \
              --output-signature "${dir}/sbom.json.sig" \
              "${dir}/sbom.json"

            # CVE scan
            grype "${image}" -o json > "${dir}/cve-report.json"
            cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY \
              --output-signature "${dir}/cve-report.json.sig" \
              "${dir}/cve-report.json"

            # Extract CVE counts and enforce OPA policy
            critical=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' "${dir}/cve-report.json")
            high=$(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' "${dir}/cve-report.json")
            medium=$(jq '[.matches[] | select(.vulnerability.severity == "Medium")] | length' "${dir}/cve-report.json")
            low=$(jq '[.matches[] | select(.vulnerability.severity == "Low")] | length' "${dir}/cve-report.json")

            cat > "${dir}/opa-input.json" <<EOF
          {
            "template_id": "${template}",
            "cve_summary": {
              "critical": ${critical},
              "high": ${high},
              "medium": ${medium},
              "low": ${low}
            }
          }
          EOF

            echo "CVE summary for ${template}: critical=${critical} high=${high} medium=${medium} low=${low}"

            violations=$(opa eval \
              -d .github/pdp/policies.rego \
              -i "${dir}/opa-input.json" \
              "data.tdt.pdp.violation_security_threshold" \
              --format raw)

            if [ "$violations" != "[]" ] && [ -n "$violations" ]; then
              echo "::error::Policy violations for ${template}: ${violations}"
              exit 1
            fi

            # SLSA provenance
            cat > "${dir}/provenance.json" <<EOF
          {
            "_type": "https://in-toto.io/Statement/v1",
            "subject": [
              {
                "name": "${template}",
                "digest": {
                  "sha256": "$(docker inspect --format='{{index .RepoDigests 0}}' "${image}" 2>/dev/null | cut -d@ -f2 | sed 's/sha256://' || docker image inspect "${image}" --format '{{.Id}}' | sed 's/sha256://')"
                }
              }
            ],
            "predicateType": "https://slsa.dev/provenance/v1",
            "predicate": {
              "buildDefinition": {
                "buildType": "https://github.com/infrashift/trusted-devcontainer-templates/build/v1",
                "externalParameters": {
                  "source": {
                    "uri": "git+${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}@refs/tags/${GITHUB_REF_NAME}",
                    "digest": { "sha1": "${GITHUB_SHA}" }
                  },
                  "templateId": "${template}"
                },
                "resolvedDependencies": [
                  {
                    "uri": "src/${template}/.devcontainer/devcontainer.json"
                  }
                ]
              },
              "runDetails": {
                "builder": {
                  "id": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                },
                "metadata": {
                  "invocationId": "${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}",
                  "startedOn": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                }
              }
            }
          }
          EOF
            cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY \
              --output-signature "${dir}/provenance.json.sig" \
              "${dir}/provenance.json"

            # Checksums for all evidence artifacts
            (cd "${dir}" && sha256sum sbom.json sbom.json.sig \
              cve-report.json cve-report.json.sig \
              provenance.json provenance.json.sig \
              > checksums.sha256)
            cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY \
              --output-signature "${dir}/checksums.sha256.sig" \
              "${dir}/checksums.sha256"

            echo "::endgroup::"
          done

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: evidence/
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Job 3: Publish templates, attach attestations, dual-sign
  # ---------------------------------------------------------------------------
  publish:
    needs: scan
    runs-on: ubuntu-latest
    env:
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Download evidence
        uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: evidence/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Publish templates
        uses: devcontainers/action@v1
        with:
          publish-templates: "true"
          base-path-to-templates: "./src"
          generate-docs: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach attestations and sign
        run: |
          set -euo pipefail
          owner_repo="${GITHUB_REPOSITORY,,}"

          for template in $TEMPLATES; do
            echo "::group::Signing ${template}"
            dir="evidence/${template}"

            # Resolve the published OCI digest
            ref="${REGISTRY}/${owner_repo}/${template}:latest"
            digest=$(crane digest "${ref}")
            uri="${REGISTRY}/${owner_repo}/${template}@${digest}"

            echo "Attesting and signing ${uri}"

            # SBOM attestation
            cosign attest --yes --key env://COSIGN_PRIVATE_KEY \
              --type spdxjson \
              --predicate "${dir}/sbom.json" \
              "${uri}"

            # CVE attestation
            cosign attest --yes --key env://COSIGN_PRIVATE_KEY \
              --type vuln \
              --predicate "${dir}/cve-report.json" \
              "${uri}"

            # SLSA provenance attestation
            cosign attest --yes --key env://COSIGN_PRIVATE_KEY \
              --type slsaprovenance1 \
              --predicate "${dir}/provenance.json" \
              "${uri}"

            # Sovereign key signing
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${uri}"

            # Keyless OIDC signing (Sigstore Fulcio/Rekor)
            cosign sign --yes "${uri}"

            echo "::endgroup::"
          done

      - name: Create GitHub Release with evidence
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            evidence/*/sbom.json
            evidence/*/sbom.json.sig
            evidence/*/cve-report.json
            evidence/*/cve-report.json.sig
            evidence/*/provenance.json
            evidence/*/provenance.json.sig
            evidence/*/checksums.sha256
            evidence/*/checksums.sha256.sig
