name: Sync Containerfile Check

on:
  pull_request:
    paths:
      - 'shared/Containerfile'
      - 'src/*/.devcontainer/Containerfile'
  push:
    branches: [main]
    paths:
      - 'shared/Containerfile'
      - 'src/*/.devcontainer/Containerfile'

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify all Containerfiles match canonical source
        run: |
          failed=0
          for f in src/*/.devcontainer/Containerfile; do
            template="$(echo "$f" | cut -d/ -f2)"
            if ! diff -q shared/Containerfile "$f" > /dev/null 2>&1; then
              echo "DRIFT DETECTED: $f differs from shared/Containerfile"
              diff shared/Containerfile "$f" || true
              failed=1
            else
              echo "OK: $template"
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo ""
            echo "Fix: copy shared/Containerfile to the drifted template(s)"
            exit 1
          fi
