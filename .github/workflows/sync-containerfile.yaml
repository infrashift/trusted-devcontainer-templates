name: Sync Containerfile Check

on:
  pull_request:
    paths:
      - 'shared/Containerfile'
      - 'src/*/.devcontainer/Containerfile'
      - '.devcontainer/Containerfile'
  push:
    branches: [main]
    paths:
      - 'shared/Containerfile'
      - 'src/*/.devcontainer/Containerfile'
      - '.devcontainer/Containerfile'

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify all Containerfiles match canonical source
        run: |
          failed=0
          # Includes this repo's own .devcontainer/Containerfile, which previously
          # escaped this check and had already diverged from shared/Containerfile.
          for f in .devcontainer/Containerfile src/*/.devcontainer/Containerfile; do
            if ! diff -q shared/Containerfile "$f" > /dev/null 2>&1; then
              echo "DRIFT DETECTED: $f differs from shared/Containerfile"
              diff shared/Containerfile "$f" || true
              failed=1
            else
              echo "OK: $f"
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo ""
            echo "Fix: make sync-containerfiles"
            exit 1
          fi
