name: Test Templates

on:
  pull_request:
    paths:
      - 'src/**'
      - 'shared/**'
      - 'test/**'
      - '.github/pdp/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'test/**'
      - '.github/pdp/**'
      - '.github/workflows/**'

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OPA
        env:
          OPA_VERSION: v1.19.1
          OPA_SHA256: c9f985ce0d345f5484006ade2c695ed9e3f308e4441139e46695c5c182ac0839
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/opa \
            "https://github.com/open-policy-agent/opa/releases/download/${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  /tmp/opa" | sha256sum -c -
          install -m 0755 /tmp/opa /usr/local/bin/opa
          opa version

      # The release gate runs only on a tag, so without this the policy is
      # first exercised at the moment it is trusted to block a release.
      - name: Check and test the release policy
        run: |
          set -euo pipefail
          opa check --strict .github/pdp/
          opa test .github/pdp/ -v

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.changed.outputs.templates }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed templates
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # On push to main, test all templates
            templates=$(ls -d src/*/ | xargs -I{} basename {} | jq -R -s -c 'split("\n") | map(select(. != ""))')
          else
            # On PR, only test changed templates
            changed_files=$(gh pr diff ${{ github.event.pull_request.number }} --name-only 2>/dev/null || git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.sha }})
            templates=$(echo "$changed_files" | grep -oP '^src/\K[^/]+' | sort -u | jq -R -s -c 'split("\n") | map(select(. != ""))')
          fi
          echo "templates=${templates}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    needs: detect-changes
    if: needs.detect-changes.outputs.templates != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJson(needs.detect-changes.outputs.templates) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Build and start devcontainer
        run: |
          devcontainer up \
            --workspace-folder "src/${{ matrix.template }}" \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/test,target=/tmp/tdt-test"

      - name: Run tests
        run: |
          devcontainer exec \
            --workspace-folder "src/${{ matrix.template }}" \
            bash /tmp/tdt-test/${{ matrix.template }}/test.sh

  cve-scan:
    needs: detect-changes
    if: needs.detect-changes.outputs.templates != '[]' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install grype
        uses: anchore/scan-action/download-grype@v6

      - name: Scan changed templates for CVEs
        run: |
          set -euo pipefail
          templates='${{ needs.detect-changes.outputs.templates }}'
          sha="${GITHUB_SHA:0:12}"

          # Start summary table
          echo "## CVE Scan Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Template | Critical | High | Medium | Low |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|----------|------|--------|-----|" >> "$GITHUB_STEP_SUMMARY"

          for template in $(echo "$templates" | jq -r '.[]'); do
            echo "::group::CVE scan ${template}"
            image="tdt-pr-scan-${template}:${sha}"

            devcontainer build \
              --workspace-folder "src/${template}" \
              --image-name "${image}"

            grype "${image}" -o json > "/tmp/cve-${template}.json"

            critical=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' "/tmp/cve-${template}.json")
            high=$(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' "/tmp/cve-${template}.json")
            medium=$(jq '[.matches[] | select(.vulnerability.severity == "Medium")] | length' "/tmp/cve-${template}.json")
            low=$(jq '[.matches[] | select(.vulnerability.severity == "Low")] | length' "/tmp/cve-${template}.json")

            echo "| ${template} | ${critical} | ${high} | ${medium} | ${low} |" >> "$GITHUB_STEP_SUMMARY"

            if [ "$critical" -gt 0 ]; then
              echo "::warning::${template} has ${critical} critical CVEs"
            fi
            if [ "$high" -gt 0 ]; then
              echo "::warning::${template} has ${high} high CVEs"
            fi

            echo "::endgroup::"
          done
